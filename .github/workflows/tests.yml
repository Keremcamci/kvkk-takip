name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ubuntu-latest ships Node by default; tests/test_frontend.py uses it
      # to actually execute index.html's JS functions (davranis katmani).
      # setup-node pins a known version instead of relying on the runner's
      # preinstalled default, which changes without notice between images.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -r requirements.txt

      - run: pytest -q
