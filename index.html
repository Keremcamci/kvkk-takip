<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>KVKK Mevzuat Takip</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #ffffff; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  .uyari { background: #fff3cd; border: 1px solid #ffe69c; padding: 0.75rem 1rem; border-radius: 4px; font-size: 0.9rem; margin-bottom: 1rem; }
  .ust-satir { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; flex-wrap: wrap; gap: 0.5rem; }
  select { font-size: 1rem; padding: 0.3rem; }
  .son-guncelleme { font-size: 0.85rem; color: #555; }
  .kaynak-ozet { font-size: 0.85rem; color: #555; margin-bottom: 1rem; }
  .karar { background: #ffffff; border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
  .karar h3 { margin: 0 0 0.4rem 0; font-size: 1.05rem; }
  .tarih { color: #666; font-size: 0.85rem; }
  .kaynak-rozet { display: inline-block; background: #666; color: #fff; font-size: 0.7rem; padding: 0.1rem 0.4rem; border-radius: 3px; margin-right: 0.4rem; vertical-align: middle; }
  .aciliyet { display: inline-block; background: #d32f2f; color: #fff; font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 3px; margin-left: 0.5rem; }
  .yapilmasi-gerekenler { margin: 0.5rem 0 0 0; padding-left: 1.2rem; }
  .bos { color: #666; font-style: italic; }
  a.kaynak-link { font-size: 0.85rem; }
</style>
</head>
<body>
  <div class="uyari">
    Bu araç hukuki tavsiye değildir, bilgi amaçlıdır. Kararlar için resmi kaynağı ve/veya bir avukatı kontrol edin.
  </div>
  <h1>KVKK Mevzuat Takip</h1>
  <div class="ust-satir">
    <label>
      Şirket profili:
      <select id="profil">
        <option value="genel">Genel</option>
        <option value="e-ticaret">E-ticaret</option>
        <option value="finans">Finans</option>
        <option value="saglik">Sağlık</option>
        <option value="egitim">Eğitim</option>
      </select>
    </label>
    <span class="son-guncelleme" id="son-guncelleme"></span>
  </div>
  <!-- Seçili profilden BAĞIMSIZ: "genel" profili yalnızca "genel" etiketli
       kararları gösterdiği için, BDDK/SPK kararları veritabanında dururken
       kullanıcı bunların varlığını hiç fark etmiyordu. -->
  <div class="kaynak-ozet" id="kaynak-ozet"></div>
  <div id="liste"></div>

  <script>
    const profilSelect = document.getElementById("profil");
    const liste = document.getElementById("liste");
    const sonGuncellemeEl = document.getElementById("son-guncelleme");
    const kaynakOzetEl = document.getElementById("kaynak-ozet");

    // Metin (text node) içeriği için: &, <, > yeterli.
    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // HTML ÖZNİTELİK değeri için: tırnakları da kaçırmak ZORUNLU. esc() bunu
    // yapmaz; tırnak kaçırılmazsa gerçek karar başlıklarındaki " karakteri
    // özniteliğin dışına çıkıp (örn. onmouseover=) öznitelik enjeksiyonuna
    // izin verir. Öznitelik içine giren HER değer escAttr()'dan geçmeli.
    function escAttr(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Tırnak kaçırmak javascript: şemasını engellemez — şemayı ayrıca doğrula.
    function guvenliUrl(url) {
      const temiz = String(url ?? "").trim();
      return /^https?:\/\//i.test(temiz) ? temiz : null;
    }

    function formatTarih(iso) {
      if (!iso) return null;
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleString("tr-TR");
    }

    // "Toplam: 8 KVKK, 10 BDDK, 10 SPK karar takip ediliyor."
    // Sıra sabittir (sözlük SQLite'tan alfabetik gelir); sayısı 0 olan ya da
    // hiç taranmamış kaynak "0 BDDK" diye gösterilmez, tamamen atlanır.
    // Çıktı yalnızca sayı + sabit kaynak adı olduğu için textContent ile
    // yazılır — kaçırma (escaping) gerektiren bir yola hiç girilmez.
    function kaynakOzetMetni(kaynakSayilari) {
      const sayilar = kaynakSayilari || {};
      const bilinenSira = ["kvkk", "bddk", "spk", "resmi_gazete"];
      // Bilinmeyen bir kaynak (ileride Resmi Gazete vb.) sessizce görünmez
      // olmasın — bu satırı doğuran bulgunun tam olarak o sınıfı.
      const digerleri = Object.keys(sayilar)
        .filter((k) => bilinenSira.indexOf(k) === -1)
        .sort();
      const parcalar = bilinenSira
        .concat(digerleri)
        .filter((k) => sayilar[k] > 0)
        .map((k) => `${sayilar[k]} ${kaynakEtiketi(k)}`);
      if (parcalar.length === 0) return "";
      return `Toplam: ${parcalar.join(", ")} karar takip ediliyor.`;
    }

    // Harita fonksiyon İÇİNE gömülü: _node_calistir testleri fonksiyon
    // gövdelerini tek tek çıkarıp çalıştırıyor, üst seviye bir sabite
    // (const) referans fonksiyon dışında tanımlıysa testte "undefined"
    // hatası verir.
    function kaynakEtiketi(k) {
      const etiketler = { kvkk: "KVKK", bddk: "BDDK", spk: "SPK", resmi_gazete: "Resmi Gazete" };
      return etiketler[k] || String(k).toUpperCase();
    }

    function kararKart(karar) {
      const kaynakRozetiHtml = karar.kaynak
        ? `<span class="kaynak-rozet">${esc(kaynakEtiketi(karar.kaynak))}</span>`
        : "";
      const aciliyetHtml = karar.aciliyet_var
        ? `<span class="aciliyet" title="${escAttr(karar.aciliyet_aciklama)}">Aciliyet</span>`
        : "";
      const maddeler = (karar.yapilmasi_gerekenler || [])
        .map((m) => `<li>${esc(m)}</li>`)
        .join("");
      const url = guvenliUrl(karar.kaynak_url);
      const kaynakHtml = url
        ? `<a class="kaynak-link" href="${escAttr(url)}" target="_blank" rel="noopener">Kaynağı gör</a>`
        : "";
      return `
        <div class="karar">
          <h3>${kaynakRozetiHtml}${esc(karar.baslik)}${aciliyetHtml}</h3>
          <div class="tarih">${esc(karar.tarih)}</div>
          <p>${esc(karar.ozet)}</p>
          ${maddeler ? `<ul class="yapilmasi-gerekenler">${maddeler}</ul>` : ""}
          ${kaynakHtml}
        </div>
      `;
    }

    async function yukle() {
      const profil = profilSelect.value;
      const res = await fetch(`/api/kararlar?profil=${encodeURIComponent(profil)}`);
      const veri = await res.json();
      const sonGuncelleme = formatTarih(veri.son_guncelleme);
      sonGuncellemeEl.textContent = sonGuncelleme
        ? `Son güncelleme: ${sonGuncelleme}`
        : "Henüz veri yok";
      // Boş liste dalından ÖNCE: bu satırın asıl işe yaradığı durum tam da
      // seçili profilin hiç karar döndürmediği durum.
      kaynakOzetEl.textContent = kaynakOzetMetni(veri.kaynak_sayilari);
      if (!veri.kararlar || veri.kararlar.length === 0) {
        liste.innerHTML = '<p class="bos">Bu profil için henüz karar yok.</p>';
        return;
      }
      liste.innerHTML = veri.kararlar.map(kararKart).join("");
    }

    profilSelect.addEventListener("change", yukle);
    yukle();
  </script>
</body>
</html>
